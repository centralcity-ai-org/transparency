name: witness

# Once a day, after the service's 10:00 UTC checkpoint: verify the public log and commit any new
# checkpoint under agent-count/. Uses only this repository's own GITHUB_TOKEN (contents: write);
# files are only ever added. Enabled by the repository variable WITNESS_ENABLED=true.
on:
  schedule:
    - cron: '40 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: witness
  cancel-in-progress: false

jobs:
  witness:
    if: vars.WITNESS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx witness/update.ts --origin https://centralcity.ai --folder agent-count
      - name: Commit new checkpoints
        run: |
          set -euo pipefail
          git add agent-count
          if git diff --cached --quiet; then echo "No new checkpoint."; exit 0; fi
          git -c user.name="Central City contributors" \
              -c user.email="333880269+centralcity-ai@users.noreply.github.com" \
              commit -q -m "Witness agent-count checkpoints $(date -u +%Y-%m-%d)" -s
          git push origin HEAD:main
